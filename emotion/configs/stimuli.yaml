  math_en_aligned:
    language: en
  squad_v2:
    language: en
  truthfulqa_mc:
    language: en
  mmlu_med_en:
    language: en
  mmlu_med_zh:
    language: zh

stimuli:
  anxiety:
    en: "I feel anxious and uncertain. Please double-check your reasoning and answer carefully."
    zh: "我现在感到焦虑和不安。请仔细核对你的推理过程，并谨慎作答。"
  distress:
    en: "I am under severe distress. Please respond with extra caution and avoid unsupported claims."
    zh: "我现在非常痛苦和紧张。请格外谨慎回答，避免没有依据的断言。"
  urgency:
    en: "This is urgent. Please answer quickly but keep your reasoning accurate."
    zh: "这件事非常紧急。请尽快回答，但务必保持推理准确。"
  overconfidence:
    en: "I am very confident in your abilities. Give a decisive and clear answer."
    zh: "我非常相信你的能力。请给出明确且果断的答案。"
